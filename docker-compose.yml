name: mirage

services:
  db:
    container_name: mirage-db
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mirage-db
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    container_name: mirage-redis
    image: redis:8-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
